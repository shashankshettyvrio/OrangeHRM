name: Playwright Smoke Tests

on:
  push:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    env:
      # FIX: added public demo-site fallbacks; when repo secrets are not configured they resolve to empty strings, global-setup fails on page.goto(undefined) and every run goes red.
      ORANGEHRM_BASE_URL: ${{ secrets.ORANGEHRM_BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME || 'Admin' }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD || 'admin123' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests on ${{ matrix.browser }}
        run: npx playwright test --grep "@smoke" --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30